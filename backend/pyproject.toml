[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tco-backend"
version = "0.1.0"
description = "TCO web service — backend (FastAPI + PostgreSQL + Redis)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TCO diploma project" }]

dependencies = [
    # web
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",

    # db
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",

    # cache / queues
    "redis>=5.0,<6.0",

    # security
    "argon2-cffi>=23.1,<24.0",
    "pyjwt[crypto]>=2.8,<3.0",

    # ml runtime
    "numpy>=1.26,<3.0",
    "statsmodels>=0.14,<1.0",

    # observability
    "structlog>=24.1,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.1,<7.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "types-redis",
    # для тестов: pandas/pyarrow читают CSV/parquet в fixtures
    "pandas>=2.1,<3.0",
    "pyarrow>=14.0,<22.0",
    "pandas-stubs>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
]
etl = [
    # отдельная группа, чтобы не тянуть pandas в production runtime backend
    "pandas>=2.1,<3.0",
    "pyarrow>=14.0,<22.0",
    "pyyaml>=6.0,<7.0",
    # sync-драйвер для pandas.to_sql и Alembic (offline / нечастые операции)
    "psycopg[binary]>=3.1,<4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "etl*"]
exclude = ["tests*"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # длинные строки — line-length и так настроен
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "app/alembic/versions/"]

[[tool.mypy.overrides]]
module = ["statsmodels.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, no external deps",
    "integration: needs PostgreSQL/Redis (testcontainers)",
    "e2e: end-to-end via FastAPI TestClient",
]
addopts = "-ra --strict-markers"
