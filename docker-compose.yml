services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tco
      POSTGRES_PASSWORD: tco
      POSTGRES_DB: tco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tco -d tco"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    environment:
      APP_ENV: dev
      APP_CORS_ORIGINS: http://localhost:4173,http://127.0.0.1:4173,http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgresql+asyncpg://tco:tco@postgres:5432/tco
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./ml:/ml:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "4173:4173"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata: {}
