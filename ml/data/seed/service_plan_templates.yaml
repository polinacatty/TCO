# Service plan templates — sprint 3 step S3.2.
#
# Per-template default service schedule keyed by (segment × brand_tier).
# Segments are the 6 used in depreciation_rates.csv and depreciation_calibration.csv:
#   A_B, C_D, E_F, J_SUV, J_CROSS, LCV.
# Brand tiers are the 5 used in car_makes.csv:
#   russian, mass, japanese_korean_mass, chinese, premium.
# Cartesian = 30 pairs, all of which must be covered by exactly one template.
#`
# Each operation references service_operations.csv by `code`. Intervals are
# either every_km (mileage-based), every_months (calendar-based) or both
# (whichever comes first). TCO counts a mileage hit only after each full
# every_km interval (first service at 10_000 km when every_km=10_000).
#
# Sources for intervals: per-segment service manuals from owners' books
# (Toyota / VAG / BMW / Geely / Chery / Haval / Lada / Renault), cross-checked
# against drive2.ru per-model bortovye journals, 2025–2026. Full per-template
# justification — 08_complex_components_methodology.md §2.
#
# This file feeds _service_plans_build.py (step 3.3) which fans out from
# 10 templates to all 480 generations of car_generations.csv.

version: "1.0"
valid_from: "2026-04-28"

# ---------------------------------------------------------------------------
# Mapping (segment × brand_tier) -> template name. Cartesian must be complete.
# Validator reconstructs the reverse index from `applies_to` lists below; this
# section is here for human readability only.
# ---------------------------------------------------------------------------
#
# segment    | russian              | mass               | jp_kr_mass         | chinese                   | premium
# -----------|----------------------|--------------------|--------------------|---------------------------|---------------------------
# A_B        | template_economy     | template_economy   | template_economy   | template_chinese_passenger| template_premium_passenger
# C_D        | template_mid_size    | template_mid_size  | template_mid_size  | template_chinese_passenger| template_premium_passenger
# E_F        | template_mid_size    | template_mid_size  | template_mid_size  | template_chinese_passenger| template_premium_passenger
# J_SUV      | template_suv         | template_suv       | template_suv       | template_suv              | template_suv_premium
# J_CROSS    | template_crossover   | template_crossover | template_crossover | template_chinese_crossover| template_premium_crossover
# LCV        | template_lcv         | template_lcv       | template_lcv       | template_lcv              | template_lcv

