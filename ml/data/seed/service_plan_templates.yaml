      - {segment: A_B, brand_tier: russian}
      - {segment: A_B, brand_tier: mass}
      - {segment: A_B, brand_tier: japanese_korean_mass}
    operations:
      - {code: oil_change_engine,         every_km: 15000, every_months: 12}
      - {code: oil_filter,                every_km: 15000, every_months: 12}
      - {code: air_filter,                every_km: 30000, every_months: 24}
      - {code: cabin_filter,              every_km: 15000, every_months: 12}
      - {code: fuel_filter,               every_km: 60000, every_months: 48}
      - {code: coolant_change,            every_km: 80000, every_months: 60}
      - {code: brake_fluid_change,        every_km: 60000, every_months: 24}
      - {code: brake_pads_front,          every_km: 40000}
      - {code: brake_pads_rear,           every_km: 60000}
      - {code: brake_discs_front,         every_km: 80000}
      - {code: spark_plugs,               every_km: 30000, every_months: 36}
      - {code: timing_belt_kit,           every_km: 90000, every_months: 72}
      - {code: accessory_belt,            every_km: 60000, every_months: 60}
      - {code: battery_replacement,       every_months: 48}
      - {code: wiper_blades_front,        every_months: 12}
      - {code: wiper_blades_rear,         every_months: 12}
